# Cấu hình cổng chạy Spring Boot Backend
server.port=8080

# Tên ứng dụng
spring.application.name=iot-backend

# ==========================================
# 1. CẤU HÌNH KẾT NỐI MYSQL DATABASE
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/iot_system?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=binh2502
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# 2. CẤU HÌNH MQTT BROKER (MOSQUITTO)
# ==========================================
mqtt.broker.url=tcp://localhost:8888
mqtt.client.id=SpringBoot_Backend_Server
mqtt.username=binh
mqtt.password=b23dccn084

# Tên các Topic giao tiếp với ESP8266
mqtt.topic.sensor=sensor_data
mqtt.topic.control=device_control
mqtt.topic.response=device_response

